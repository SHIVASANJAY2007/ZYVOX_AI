version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: zyvox-db
    restart: always
    environment:
      POSTGRES_USER: zyvox_user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: zyvox
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zyvox_user -d zyvox"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: zyvox-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://zyvox_user:password@db:5432/zyvox
      PORT: 5000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
