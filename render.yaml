services:
  - type: web
    name: zyvox-backend
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: N8N_WEBHOOK_URL
        sync: false
